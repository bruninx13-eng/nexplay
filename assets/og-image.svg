    <circle cx="1030" cy="168" r="108" fill="#06162C" fill-opacity="0.45" stroke="#8FE4FF" stroke-opacity="0.25"/>
    <path d="M1012 130L1058 168L1012 206V130Z" fill="url(#neon)" opacity="0.85" filter="url(#markGlow)"/>
  </g>

  <g>
    <rect x="70" y="48" width="92" height="92" rx="24" fill="#071120" stroke="#16467C" stroke-width="2"/>
    <path d="M93 117V71L139 117V71" fill="none" stroke="url(#mark)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" filter="url(#markGlow)" mask="url(#playCut)"/>
    <path d="M105 84L131 100L105 116V84Z" fill="#FFFFFF"/>
  </g>
  <text x="184" y="94" fill="#FFFFFF" font-family="Arial Black, Arial, sans-serif" font-size="34" font-weight="900" letter-spacing="5">NEXPLAY</text>
  <text x="186" y="120" fill="#A5B4C8" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="4">ENTRETENIMENTO DIGITAL</text>

  <text x="72" y="252" fill="#FFFFFF" font-family="Arial Black, Arial, sans-serif" font-size="62" font-weight="900" letter-spacing="-2">SEU PRÓXIMO</text>
  <text x="72" y="326" fill="url(#neon)" font-family="Arial Black, Arial, sans-serif" font-size="62" font-weight="900" letter-spacing="-2">ENTRETENIMENTO</text>
  <text x="72" y="400" fill="#FFFFFF" font-family="Arial Black, Arial, sans-serif" font-size="62" font-weight="900" letter-spacing="-2">COMEÇA AQUI.</text>

  <text x="76" y="458" fill="#A5B4C8" font-family="Arial, sans-serif" font-size="24">Descubra nossas opções e encontre a experiência ideal</text>
  <text x="76" y="490" fill="#A5B4C8" font-family="Arial, sans-serif" font-size="24">para você e sua família.</text>

