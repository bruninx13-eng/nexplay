<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#05070D"/>
      <stop offset="0.55" stop-color="#070D18"/>
      <stop offset="1" stop-color="#03060C"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0" cy="0" r="1" gradientTransform="translate(930 120) rotate(120) scale(620 500)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#087BFF" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#087BFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0" cy="0" r="1" gradientTransform="translate(260 590) rotate(-50) scale(430 300)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#28B9FF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#28B9FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="neon" x1="380" y1="285" x2="780" y2="345" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8FE4FF"/>
      <stop offset="0.5" stop-color="#28B9FF"/>
      <stop offset="1" stop-color="#087BFF"/>
    </linearGradient>
    <linearGradient id="mark" x1="70" y1="48" x2="150" y2="140" gradientUnits="userSpaceOnUse">
      <stop stop-color="#28B9FF"/>
      <stop offset="1" stop-color="#087BFF"/>
    </linearGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#28B9FF" stroke-opacity="0.06"/>
    </pattern>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="markGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <mask id="playCut">
      <rect width="1200" height="630" fill="white"/>
      <path d="M105 84L131 100L105 116V84Z" fill="black"/>
    </mask>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <g opacity="0.65">
    <circle cx="1030" cy="168" r="230" fill="none" stroke="#28B9FF" stroke-opacity="0.12"/>
